<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Book Library</title>
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-4">
      <!-- Header -->
      <div class="jumbotron text-center">
        <h1>My Book Library</h1>
        <p>Add books to your virtual library</p>
      </div>

      <!-- Add Book Button -->
      <div class="text-center mb-3">
        <button
          class="btn btn-info"
          data-toggle="collapse"
          data-target="#addBookForm"
        >
          Add New Book
        </button>
      </div>

      <!-- Add Book Form -->
      <div id="addBookForm" class="collapse">
        <form id="bookForm" class="form-group mx-auto">
          <label for="title">Title:</label>
          <input
            type="text"
            class="form-control mb-2"
            id="title"
            placeholder="Enter book title"
            required
          />

          <label for="author">Author:</label>
          <input
            type="text"
            class="form-control mb-2"
            id="author"
            placeholder="Enter author name"
            required
          />

          <label for="pages">Pages:</label>
          <input
            type="number"
            class="form-control mb-2"
            id="pages"
            placeholder="Number of pages"
            required
          />

          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="check" />
            <label class="form-check-label" for="check">Read</label>
          </div>

          <input type="submit" class="btn btn-primary btn-block" value="Add Book" />
        </form>
      </div>

      <!-- Books Table -->
      <div class="table-responsive">
        <table class="table table-bordered table-striped mt-4" id="display">
          <thead class="thead-dark">
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Pages</th>
              <th>Read</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
